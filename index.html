<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZGqt6b2QJn_pwkmDmzlU4x1WcruFAWfA",

    projectId: "fieldops-fibra",

    messagingSenderId: "469526464060",

  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ── Expõe funções globais para o restante do app ──
  window._db = db;
  window._col = (name) => collection(db, name);
  window._doc = (col, id) => doc(db, col, id);
  window._setDoc = setDoc;
  window._deleteDoc = deleteDoc;
  window._getDocs = getDocs;
  window._onSnapshot = onSnapshot;
  window._writeBatch = () => writeBatch(db);

  window._fbReady = true;

<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #0F172A;
  --surface:   #1E293B;
  --surface2:  #273448;
  --border:    #334155;
  --text:      #F1F5F9;
  --muted:     #94A3B8;
  --accent:    #F97316;
  --accent-lo: rgba(249,115,22,.12);
  --ok:        #22C55E;
  --ok-lo:     rgba(34,197,94,.12);
  --warn:      #FBBF24;
  --warn-lo:   rgba(251,191,36,.12);
  --danger:    #EF4444;
  --danger-lo: rgba(239,68,68,.12);
  --info:      #38BDF8;
  --info-lo:   rgba(56,189,248,.12);
  --radius:    10px;
  --font:      'IBM Plex Sans', system-ui, sans-serif;
  --mono:      'IBM Plex Mono', monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:       #F1F5F9;
    --surface:  #FFFFFF;
    --surface2: #F8FAFC;
    --border:   #E2E8F0;
    --text:     #0F172A;
    --muted:    #64748B;
  }
}
:root[data-theme="light"] {
  --bg:       #F1F5F9;
  --surface:  #FFFFFF;
  --surface2: #F8FAFC;
  --border:   #E2E8F0;
  --text:     #0F172A;
  --muted:    #64748B;
}

/* ── RESET ───────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);overflow:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
img{max-width:100%;display:block}

/* ── UTILITIES ───────────────────────────────────────────── */
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .danger{color:var(--danger)} .accent{color:var(--accent)} .muted{color:var(--muted)}

/* ── SCREEN STACK ────────────────────────────────────────── */
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ── LOGIN ───────────────────────────────────────────────── */
#screen-login{align-items:center;justify-content:center;gap:32px;padding:32px 20px}
.login-logo{display:flex;align-items:center;gap:12px}
.login-logo svg{width:40px;height:40px}
.login-logo h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.login-logo span{color:var(--accent)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px}
.login-card h2{font-size:16px;font-weight:600}
.login-profiles{display:grid;gap:10px}
.profile-btn{display:flex;align-items:center;gap:14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;transition:.15s}
.profile-btn:hover{border-color:var(--accent);background:var(--accent-lo)}
.profile-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.profile-info{text-align:left}
.profile-info strong{display:block;font-size:14px;font-weight:600}
.profile-info small{color:var(--muted);font-size:12px}

/* ── TOP BAR ─────────────────────────────────────────────── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:env(safe-area-inset-top,0px)}

.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.avatar-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.badge-count{background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}

/* ── BOTTOM NAV (mobile) ─────────────────────────────────── */
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}

.bnav-item.active{color:var(--accent)}
.bnav-item svg{width:20px;height:20px}

/* ── PAGE SHELL ──────────────────────────────────────────── */

.page-header h2{font-size:17px;font-weight:700}

.page-content{flex:1;overflow-y:auto;padding:16px}
.page-content.no-pad{padding:0}

/* ── FORMS ───────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;width:100%;transition:.15s;color:var(--text)}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}

.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{background:#16a34a}

/* ── CARDS & LISTS ───────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-body{padding:14px}
.card + .card{margin-top:10px}

.os-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;margin-bottom:10px}
.os-card-head{padding:12px 14px;display:flex;align-items:center;gap:10px}

.os-meta-item{font-size:11px;color:var(--muted)}

.os-card-actions{display:flex;gap:8px;margin-top:4px}

/* ── STATUS CHIPS ────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip-aguardando{background:var(--warn-lo);color:var(--warn)}
.chip-em-campo{background:var(--info-lo);color:var(--info)}
.chip-concluido{background:var(--ok-lo);color:var(--ok)}

/* ── PRIORITY STRIPE ─────────────────────────────────────── */
.os-card[data-priority="emergencia"]{border-left:3px solid var(--danger)}
.os-card[data-priority="normal"]{border-left:3px solid var(--accent)}
.os-card[data-priority="apoio"]{border-left:3px solid var(--info)}

/* ── PHOTO UPLOAD ZONE ───────────────────────────────────── */
.photo-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:.15s;background:var(--surface);position:relative;overflow:hidden}
.photo-zone:hover{border-color:var(--accent);background:var(--accent-lo)}
.photo-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-zone-icon{font-size:28px;margin-bottom:6px}
.photo-zone p{font-size:12px;color:var(--muted)}
.photo-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photo-preview-item{aspect-ratio:1;border-radius:6px;overflow:hidden;position:relative;background:var(--surface2)}
.photo-preview-item img{width:100%;height:100%;object-fit:cover}
.photo-preview-item button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:18px;text-align:center}

/* ── STATS ROW ───────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:500px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat-card .stat-n{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat-card .stat-l{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card .stat-sub{font-size:11px;margin-top:6px}

/* ── CHART ───────────────────────────────────────────────── */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.chart-wrap h3{font-size:13px;font-weight:600;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:80px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0}
.bar-track{flex:1;background:var(--surface2);border-radius:99px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:.6s}
.bar-val{width:32px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ── DETAIL PANEL ────────────────────────────────────────── */
.detail-panel{display:flex;flex-direction:column;height:100%}
.detail-section{padding:14px;border-bottom:1px solid var(--border)}
.detail-section h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:11px;color:var(--muted)}
.kv strong{font-size:13px}
.evidence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.evidence-img{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--surface2)}
.evidence-img img{width:100%;height:100%;object-fit:cover}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}

.report-header{background:linear-gradient(135deg,#F97316 0%,#C2410C 100%);color:#fff;padding:20px 16px}
.report-header h2{font-size:18px;font-weight:700}
.report-header p{font-size:12px;opacity:.8;margin-top:2px}
.report-id{font-family:var(--mono);font-size:11px;opacity:.7;margin-bottom:8px}

/* ── MODAL OVERLAY ───────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:100;backdrop-filter:blur(4px)}
.modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto -4px}
.modal-title{font-size:17px;font-weight:700}
.form-stack{display:flex;flex-direction:column;gap:14px}

/* ── TECH MOBILE VIEW ────────────────────────────────────── */
.my-os-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;position:relative}
.my-os-card[data-priority="emergencia"]{border-left:3px solid var(--danger)}
.my-os-card[data-priority="normal"]{border-left:3px solid var(--accent)}
.my-os-card[data-priority="apoio"]{border-left:3px solid var(--info)}
.os-id{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px}
.os-type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.os-type-row strong{font-size:15px;font-weight:700;flex:1}
.os-address{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.os-desc{font-size:13px;margin-bottom:10px}
.demand-img{margin-bottom:10px}
.demand-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.demand-img-item{border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:1;cursor:pointer;position:relative}
.demand-img-item img{width:100%;height:100%;object-fit:cover;display:block}
.demand-img-item:active{opacity:.8}
/* Lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lightbox img{max-width:100%;max-height:80vh;border-radius:8px;object-fit:contain}

/* ── BAIXA FORM ──────────────────────────────────────────── */
.action-bar{display:flex;gap:8px;flex-wrap:wrap}
.timer-display{background:var(--surface2);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.timer-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent)}
.timer-label{font-size:11px;color:var(--muted)}

/* ── DASHBOARD ───────────────────────────────────────────── */
.dash-section{margin-bottom:18px}
.dash-section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.sla-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}

.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}

/* ── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}

/* ── TOAST ───────────────────────────────────────────────── */
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px 18px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)}

</style>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const USUARIOS_DEFAULT = [
  {id:'adm1', nome:'Marcus Maia', perfil:'admin', iniciais:'MM', cor:'#F59E0B', senha:'1234'},
  {id:'op1', nome:'Ana Rodrigues', perfil:'operador', iniciais:'AR', cor:'#7C3AED', senha:'1234'},
  {id:'op2', nome:'Carlos Mendes', perfil:'operador', iniciais:'CM', cor:'#0891B2', senha:'1234'},
  {id:'tc1', nome:'João Silva', perfil:'tecnico', iniciais:'JS', cor:'#F97316', senha:'1234'},
  {id:'tc2', nome:'Pedro Costa', perfil:'tecnico', iniciais:'PC', cor:'#22C55E', senha:'1234'},
  {id:'tc3', nome:'Rafael Lima', perfil:'tecnico', iniciais:'RL', cor:'#EF4444', senha:'1234'},
];
function loadUsers(){ try{ const d=localStorage.getItem('fieldops_users'); if(d){ const arr=JSON.parse(d); return arr.map(u=>({senha:'1234',...u})); } }catch(e){} return USUARIOS_DEFAULT.map(u=>({...u})); }
function saveUsers(){
  try{ localStorage.setItem('fieldops_users', JSON.stringify(USUARIOS)); }catch(e){}
  // Sincroniza com Firestore
  if(window._fbReady){
    USUARIOS.forEach(u=>{
      window._setDoc(window._doc('usuarios', u.id), u).catch(()=>{});
    });
  }
}
let USUARIOS = loadUsers();

let currentUser = null;
let ordens = loadOS();
let activeOSId = null;
let timers = {};

function loadOS(){
  try{const d=localStorage.getItem('fieldops_os');if(d)return JSON.parse(d)}catch(e){}
  return generateSampleOS();
}
function saveOS(){
  try{localStorage.setItem('fieldops_os',JSON.stringify(ordens))}catch(e){}
  // Sincroniza com Firestore
  if(window._fbReady){
    ordens.forEach(os=>{
      window._setDoc(window._doc('ordens', os.id), os).catch(()=>{});
    });
  }
}

// ── Sincronização em tempo real via Firestore ──
function iniciarSyncFirebase(){
  if(!window._fbReady) return;

  // Listener de ordens
  window._onSnapshot(window._col('ordens'), snap=>{
    const dados = [];
    snap.forEach(d=> dados.push(d.data()));
    if(dados.length > 0){
      dados.sort((a,b)=>b.criadoEm - a.criadoEm);
      ordens = dados;
      try{ localStorage.setItem('fieldops_os', JSON.stringify(ordens)); }catch(e){}
      if(currentUser) renderOpContent && renderOpContent();
    }
  });

  // Listener de usuários
  window._onSnapshot(window._col('usuarios'), snap=>{
    const dados = [];
    snap.forEach(d=> dados.push(d.data()));
    if(dados.length > 0){
      USUARIOS = dados.map(u=>({senha:'1234',...u}));
      try{ localStorage.setItem('fieldops_users', JSON.stringify(USUARIOS)); }catch(e){}
    }
  });

  // Sobe dados locais para o Firestore se estiver vazio
  window._getDocs(window._col('ordens')).then(snap=>{
    if(snap.empty && ordens.length > 0){
      ordens.forEach(os=>{
        window._setDoc(window._doc('ordens', os.id), os).catch(()=>{});
      });
    }
  });
  window._getDocs(window._col('usuarios')).then(snap=>{
    if(snap.empty){
      USUARIOS.forEach(u=>{
        window._setDoc(window._doc('usuarios', u.id), u).catch(()=>{});
      });
    }
  });
}

function uid(){ return 'OS-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900)+100) }
function fmtTime(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) }
function fmtDate(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('pt-BR') }
function fmtDateTime(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) }
function elapsed(from,to){ if(!from) return 0; const ms=(to||Date.now())-from; return Math.floor(ms/60000) }
function fmtElapsed(min){ if(!min&&min!==0) return '—'; const h=Math.floor(min/60),m=min%60; return h>0?`${h}h${m.toString().padStart(2,'0')}min`:`${m}min` }
function getUser(id){ return USUARIOS.find(u=>u.id===id)||null }
function getOS(id){ return ordens.find(o=>o.id===id) }
function statusLabel(s){ return {aguardando:'Demanda',['em-campo']:'Em Campo',concluido:'Concluído',emergencia:'Emergência',apoio:'Apoio'}[s]||s }
function chipClass(s){ return {aguardando:'chip-aguardando',['em-campo']:'chip-em-campo',concluido:'chip-concluido',emergencia:'chip-emergencia',apoio:'chip-apoio'}[s]||'' }

  let lista = listaFiltro==='todos' ? ordens : ordens.filter(o=>o.status===listaFiltro);

      const tec = getUser(os.tecnico);
      return os.id.toLowerCase().includes(listaBusca)
        || os.tipo.toLowerCase().includes(listaBusca)
        || os.endereco.toLowerCase().includes(listaBusca)
        || (tec && tec.nome.toLowerCase().includes(listaBusca));
    });
  }
  if(lista.length===0){
    body.innerHTML=`<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:13px">

      Nenhuma ordem encontrada
    </div>`;
    return;
  }
  body.innerHTML = lista.map(os=>{
    const tec = getUser(os.tecnico);
    const elapsedMin = os.iniciadoEm ? elapsed(os.iniciadoEm, os.concluidoEm||undefined) : null;
    const slaOk = elapsedMin===null || elapsedMin<=os.sla;
    return `
    <div class="os-card" data-priority="${os.priority}">

      renderFotoPreview();

/* ── LIGHTBOX ── */
let lbFotos = [], lbIdx = 0;
window.abrirLightbox = function(fotos, idx){
  lbFotos = fotos; lbIdx = idx;
  lbRender();
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
};
window.fecharLightbox = function(){
  document.getElementById('lightbox').classList.add('hidden');
  document.body.style.overflow = '';
};
window.lbNav = function(dir){
  lbIdx = (lbIdx + dir + lbFotos.length) % lbFotos.length;
  lbRender();
};
function lbRender(){
  document.getElementById('lightbox-img').src = lbFotos[lbIdx];
  document.getElementById('lightbox-counter').textContent = `${lbIdx+1} / ${lbFotos.length}`;
  document.getElementById('lb-prev').style.display = lbFotos.length > 1 ? '' : 'none';
  document.getElementById('lb-next').style.display = lbFotos.length > 1 ? '' : 'none';
}
// swipe to navigate
(function(){
  let sx = 0;
  document.addEventListener('touchstart', e=>{ if(!document.getElementById('lightbox').classList.contains('hidden')) sx = e.touches[0].clientX; });
  document.addEventListener('touchend', e=>{
    if(document.getElementById('lightbox').classList.contains('hidden')) return;
    const dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
  });
})();

/* ── DASHBOARD OPERADOR ── */
function renderOpDash(c){
  const total=ordens.length;
  const concluidos=ordens.filter(o=>o.status==='concluido');
  const emCampo=ordens.filter(o=>o.status==='em-campo');
  const demanda=ordens.filter(o=>o.status==='aguardando');
  const slaOk=concluidos.filter(o=>{ const d=o.duracaoMin||elapsed(o.iniciadoEm,o.concluidoEm); return d<=o.sla; }).length;
  const slaPerc = concluidos.length ? Math.round(slaOk/concluidos.length*100) : 0;

  const hoje=new Date(), hojeStr=`${hoje.getDate()}/${hoje.getMonth()+1}`;

  // Produção por técnico (hoje)
  const hojeInicio = new Date(); hojeInicio.setHours(0,0,0,0);
  const tecList = USUARIOS.filter(u=>u.perfil==='tecnico');
  const tecStats = tecList.map(t=>{
    const minhasOS = ordens.filter(o=>o.tecnico===t.id);
    const hoje_os  = minhasOS.filter(o=>o.criadoEm>=hojeInicio.getTime());
    const concHoje = hoje_os.filter(o=>o.status==='concluido');

function atualizarPreview(){
  const nome = document.getElementById('u-nome')?.value||'';
  const ini  = document.getElementById('u-ini')?.value||'';
  const cor  = document.getElementById('u-cor')?.value||'#94A3B8';
  const av   = document.getElementById('prev-avatar'); if(!av) return;
  const partes = nome.trim().split(/\s+/);
  let auto = ini || (partes.length>=2 ? partes[0][0]+partes[partes.length-1][0] : partes[0]?.slice(0,2)||'?');
  av.textContent = auto.toUpperCase().slice(0,2)||'?';
  av.style.background = cor+'20'; av.style.color = cor; av.style.borderColor = cor+'60';
}

window.selecionarCor = function(cor){
  document.getElementById('u-cor').value = cor;
  COR_PALETTE.forEach(c=>{
    const btn=document.getElementById('cor-btn-'+c.slice(1));
    if(btn){ btn.style.border=`3px solid ${c===cor?'#fff':'transparent'}`; btn.style.outline=c===cor?`2px solid ${c}`:'none'; }
  });
  atualizarPreview();
};

window.salvarUsuario = function(uid){
  const nome  = document.getElementById('u-nome')?.value?.trim();
  const ini   = document.getElementById('u-ini')?.value?.trim().toUpperCase().slice(0,2);
  const perfil= document.getElementById('u-perfil')?.value;
  const cor   = document.getElementById('u-cor')?.value||'#94A3B8';
  const senhaInput = document.getElementById('u-senha')?.value?.trim();
  if(!nome){ toast('⚠️ Informe o nome'); return; }
  const partes = nome.split(/\s+/);
  const iniciais = ini || (partes.length>=2?partes[0][0]+partes[partes.length-1][0]:partes[0].slice(0,2)).toUpperCase();
  if(uid){
    const u = USUARIOS.find(x=>x.id===uid); if(!u) return;
    u.nome=nome; u.iniciais=iniciais; u.perfil=perfil; u.cor=cor;
    if(senhaInput) u.senha=senhaInput;
    if(currentUser.id===uid){ currentUser.nome=nome; currentUser.iniciais=iniciais; currentUser.cor=cor; }
  } else {
    USUARIOS.push({id:'usr'+Date.now(), nome, perfil, iniciais, cor, senha: senhaInput||'1234'});
  }
  saveUsers(); closeModal(); toast(uid?'✅ Usuário atualizado':'✅ Usuário criado');
  renderAdminUsuarios(document.getElementById('op-content'));
};

window.excluirOS = function(osId){
  const i = ordens.findIndex(o=>o.id===osId); if(i<0) return;

function renderAdminPanel(c){
  const total=ordens.length;
  const concluidos=ordens.filter(o=>o.status==='concluido');
  const emCampo=ordens.filter(o=>o.status==='em-campo');
  const aguardando=ordens.filter(o=>o.status==='aguardando');
  const slaOkCount=concluidos.filter(o=>{ const d=o.duracaoMin||elapsed(o.iniciadoEm,o.concluidoEm); return d<=o.sla; }).length;
  const slaPerc=concluidos.length?Math.round(slaOkCount/concluidos.length*100):0;

  const tecStats=USUARIOS.filter(u=>u.perfil==='tecnico').map(t=>({
    ...t,
    ativas:ordens.filter(o=>o.tecnico===t.id&&o.status==='em-campo').length,
    concluidas:ordens.filter(o=>o.tecnico===t.id&&o.status==='concluido').length,
    total:ordens.filter(o=>o.tecnico===t.id).length,
    mediaMin:(()=>{
      const c=ordens.filter(o=>o.tecnico===t.id&&o.status==='concluido');
      if(!c.length) return 0;
      return Math.round(c.reduce((a,o)=>a+(o.duracaoMin||elapsed(o.iniciadoEm,o.concluidoEm)),0)/c.length);

function renderTecContent(){
  document.querySelectorAll('.bnav-item').forEach(b=>{
    b.className='bnav-item'+(b.getAttribute('onclick').includes(`'${tecTab}'`)?'  active':'');
  });
  // fix active state properly
  const items = document.querySelectorAll('.bnav-item');
  items.forEach(b=>{
    const oc=b.getAttribute('onclick')||'';
    b.classList.toggle('active', oc.includes(`'${tecTab}'`));
  });
  const c = document.getElementById('tec-content');
  if(tecTab==='minhas') renderTecMinhas(c);
  else renderTecHistorico(c);
}

function renderTecMinhas(c){
  const aguardando = ordens.filter(o=>o.tecnico===currentUser.id&&o.status==='aguardando');
  const emCampo   = ordens.filter(o=>o.tecnico===currentUser.id&&o.status==='em-campo');

  c.innerHTML = `
    <div class="page-header">
      <h2>Minhas Ordens</h2>
      <p>${emCampo.length} em campo • ${aguardando.length} em demanda</p>
    </div>

      ${emCampo.length>0?`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:8px">▶ Em Execução</div>`:''}
      ${emCampo.map(os=>renderOSCardTec(os,true)).join('')}
      ${aguardando.length>0?`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:${emCampo.length>0?'16px':0} 0 8px">DEMANDA</div>`:''}
      ${aguardando.map(os=>renderOSCardTec(os,false)).join('')}
      ${emCampo.length===0&&aguardando.length===0?`<div style="text-align:center;padding:60px 20px"><div style="font-size:32px;margin-bottom:10px">✅</div><p style="color:var(--muted);font-size:14px">Sem ordens atribuídas</p></div>`:''}
    </div>
  `;

  // Start timers for em-campo
  emCampo.forEach(os=>{
    if(timers[os.id]) return;
    timers[os.id] = setInterval(()=>{
      const el = document.getElementById('timer-'+os.id);
      if(el) el.textContent = fmtElapsed(elapsed(os.iniciadoEm));
    }, 10000);
  });
}

window.iniciarOS = function(id){

};

let baixaEvidencias = [];
window.abrirBaixa = function(id){
  baixaEvidencias = [];
  const os = getOS(id); if(!os) return;
  const dur = elapsed(os.iniciadoEm);
  const mc = document.getElementById('tec-modal');
  mc.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeTecModal()">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Registrar Conclusão</div>
        <p style="font-size:12px;color:var(--muted)">${os.id} • Tempo em campo: <strong style="color:var(--accent)">${fmtElapsed(dur)}</strong></p>

        <div class="form-stack">
          <div class="field">
            <label>Evidências Fotográficas *</label>
            <div class="photo-zone" onclick="document.getElementById('ev-input').click()">
              <input type="file" id="ev-input" accept="image/*" multiple onchange="adicionarEvidencias(this)">
              <div class="photo-zone-icon">📸</div>
              <p>Adicione fotos do serviço concluído</p>
            </div>
            <div class="photo-preview-grid" id="ev-preview"></div>
          </div>
          <div class="field">
            <label>Solução Aplicada / Observações *</label>
            <textarea id="baixa-obs" class="input" rows="4" placeholder="Descreva o serviço realizado, materiais usados, teste de sinal, etc..."></textarea>
          </div>
          <button class="btn btn-ok btn-full" onclick="concluirOS('${id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            Finalizar OS
          </button>
          <button class="btn btn-outline btn-full" onclick="closeTecModal()">Cancelar</button>
        </div>
      </div>
    </div>
  `;
};

window.adicionarEvidencias = function(input){
  const files = Array.from(input.files);
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      baixaEvidencias.push(e.target.result);
      renderEvPreview();
    };
    reader.readAsDataURL(f);
  });
};

function renderEvPreview(){
  const grid=document.getElementById('ev-preview'); if(!grid) return;
  grid.innerHTML = baixaEvidencias.map((src,i)=>`
    <div class="photo-preview-item">
      <img src="${src}" alt="ev">
      <button onclick="removerEv(${i})">✕</button>
    </div>
  `).join('');
}
window.removerEv = function(i){ baixaEvidencias.splice(i,1); renderEvPreview(); };

window.concluirOS = function(id){
  const os = getOS(id); if(!os) return;
  const obs = document.getElementById('baixa-obs')?.value?.trim();
  if(baixaEvidencias.length===0){ toast('⚠️ Adicione ao menos uma foto de evidência'); return; }
  if(!obs){ toast('⚠️ Descreva a solução aplicada'); return; }
  os.status='concluido'; os.concluidoEm=Date.now();
  os.evidencias=[...baixaEvidencias]; os.obs=obs;
  os.duracaoMin = elapsed(os.iniciadoEm, os.concluidoEm);
  if(timers[id]){ clearInterval(timers[id]); delete timers[id]; }
  saveOS(); closeTecModal();
  toast('✅ OS concluída com sucesso!', 3000);
  renderTecContent();
};

function renderTecHistorico(c){
  const concluidas = ordens.filter(o=>o.tecnico===currentUser.id&&o.status==='concluido');
  const totalMin = concluidas.reduce((a,o)=>a+(o.duracaoMin||0),0);
  const slaOk = concluidas.filter(o=>(o.duracaoMin||0)<=o.sla).length;

  c.innerHTML = `
    <div class="page-header"><h2>Meu Histórico</h2><p>${concluidas.length} serviços concluídos</p></div>
    <div class="page-content">
      <div class="stats-row" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-n ok">${concluidas.length}</div><div class="stat-l">Concluídos</div></div>
        <div class="stat-card"><div class="stat-n">${fmtElapsed(concluidas.length?Math.round(totalMin/concluidas.length):0)}</div><div class="stat-l">Média</div></div>
        <div class="stat-card" style="grid-column:span 2"><div class="stat-n" style="color:${slaOk===concluidas.length?'var(--ok)':'var(--warn)'}">${concluidas.length?Math.round(slaOk/concluidas.length*100):0}%</div><div class="stat-l">SLA Cumprido</div></div>
      </div>
      ${concluidas.length===0?`<p style="text-align:center;color:var(--muted);padding:40px 0">Nenhum serviço concluído</p>`:''}
      ${concluidas.map(os=>{
        const dur=os.duracaoMin||elapsed(os.iniciadoEm,os.concluidoEm);
        const ok=dur<=os.sla;
        return `
          <div class="my-os-card" data-priority="${os.priority}" style="padding-bottom:10px">
            <div class="os-id">${os.id}</div>
            <div class="os-type-row"><strong>${os.tipo}</strong><span class="chip chip-concluido">Concluído</span></div>
            <div class="os-address"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${os.endereco}</div>
            <div style="display:flex;gap:10px;margin-top:8px">
              <div><div style="font-size:10px;color:var(--muted)">Duração</div><div style="font-size:15px;font-weight:700;color:${ok?'var(--ok)':'var(--danger)'}">${fmtElapsed(dur)}</div></div>
              <div><div style="font-size:10px;color:var(--muted)">SLA</div><div style="font-size:15px;font-weight:700;color:var(--muted)">${os.sla}min</div></div>
              <div><div style="font-size:10px;color:var(--muted)">Concluído</div><div style="font-size:13px;font-weight:500">${fmtDateTime(os.concluidoEm)}</div></div>
            </div>
            ${os.evidencias.length>0?`<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto">${os.evidencias.map(e=>`<div style="width:56px;height:56px;flex-shrink:0;border-radius:6px;overflow:hidden;background:var(--surface2)"><img src="${e}" style="width:100%;height:100%;object-fit:cover"></div>`).join('')}</div>`:''}
          </div>`;
      }).join('')}
    </div>
  `;
}

function buildCSV(){
  const cols = [
    'ID','Tipo','Status','Prioridade','Endereço','Descrição',
    'Operador','Técnico','SLA (min)','Duração (min)',
    'Criado em','Atribuído em','Iniciado em','Concluído em',
    'SLA Cumprido','Observações'
  ];
  const cell = v => {
    if(v == null || v === '') return '';
    const s = String(v);
    if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const rows = ordens.map(os=>{
    const tec = getUser(os.tecnico);
    const op  = getUser(os.operador);
    const dur = os.duracaoMin != null ? os.duracaoMin : (os.iniciadoEm ? elapsed(os.iniciadoEm, os.concluidoEm||undefined) : '');
    const slaOk = dur !== '' ? (dur <= os.sla ? 'Sim' : 'Não') : '';
    return [
      os.id, os.tipo, statusLabel(os.status), os.priority,
      os.endereco, os.descricao,
      op ? op.nome : '', tec ? tec.nome : '',
      os.sla, dur,
      os.criadoEm   ? new Date(os.criadoEm  ).toLocaleString('pt-BR') : '',
      os.atribuido  ? new Date(os.atribuido  ).toLocaleString('pt-BR') : '',
      os.iniciadoEm ? new Date(os.iniciadoEm ).toLocaleString('pt-BR') : '',
      os.concluidoEm? new Date(os.concluidoEm).toLocaleString('pt-BR') : '',
      slaOk, os.obs || ''
    ].map(cell).join(',');
  });
  return '﻿' + cols.join(',') + '\n' + rows.join('\n');
}

window.exportarExcel = async function(){
  toast('⏳ Preparando exportação…');
  const downloads = await window.claude?.use('downloads');
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const filename = `fieldops_atividades_${stamp}.csv`;
  const csv = buildCSV();
  if(downloads){
    try{
      await downloads.save({ filename, data: csv });
      toast('✅ Exportado: '+filename);
    } catch(e){
      if(e?.code !== 'cancelled') toast('⚠️ Erro ao exportar: '+(e?.message||e));
    }
  } else {
    // fallback: data URI (funciona em maioria dos navegadores fora do artifact viewer)
    const uri = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    const a = Object.assign(document.createElement('a'),{href:uri,download:filename});
    document.body.appendChild(a); a.click(); a.remove();
    toast('✅ Exportado: '+filename);
  }
};
